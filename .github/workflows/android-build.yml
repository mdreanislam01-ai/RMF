name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools cmake;3.22.1 ndk;25.1.8937393'

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli --save-dev

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.rmf.microfinance",
            "appName": "RMF MicroFinance",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Initialize Capacitor
        run: npx cap init "RMF MicroFinance" com.rmf.microfinance --web-dir dist || true

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Update Capacitor plugins
        run: npx cap update android

      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap sync android

      - name: Make gradlew executable and clean
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RMF-MicroFinance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30